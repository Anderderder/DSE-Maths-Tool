<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DSE MC Generator · Equation of Straight Line</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;700&family=Noto+Serif+TC:wght@500;700&family=Source+Sans+3:wght@400;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/app.css" />
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
</head>
<body>
  <div id="root">Loading DSE MC Generator…</div>
  <!--
    LLM modes:
      Gemini browserKey (default): Settings → paste Gemini key, or window.GEMINI_API_KEY = "…"
      Poe:                         Settings → paste Poe key (use start.bat for /api/poe proxy)
                                   window.POE_API_KEY = "…"; optional window.POE_MODEL = "Gemini-2.5-Flash"
      Force provider:              window.DSE_MC_PROVIDER = "gemini" | "poe"
      Gemini proxy (Enterprise):   window.DSE_MC_GEMINI_MODE = "proxy";
                                   window.GEMINI_PROXY_URL = "http://localhost:8787/api/generate";
  -->
  <script type="module">
    import('./js/app.js').catch((err) => {
      const root = document.getElementById('root');
      root.innerHTML =
        '<pre style="white-space:pre-wrap;color:#9b1c1c;padding:1rem;font-family:Consolas,monospace">' +
        'App failed to start:\n' +
        String(err && err.message ? err.message : err) +
        '\n\nServe this folder with:\n  npx serve -l 3457 "DseMcGenerator"\n' +
        'Then open http://localhost:3457/</pre>';
      console.error(err);
    });
  </script>
</body>
</html>
